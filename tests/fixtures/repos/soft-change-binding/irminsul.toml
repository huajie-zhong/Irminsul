project_name = "soft-change-binding-fixture"

[paths]
docs_root = "docs"
source_roots = ["app"]

[checks]
enabled = [
    "frontmatter",
    "globs",
    "uniqueness",
    "links",
    "schema-leak",
    "coverage",
    "prose-file-reference",
    "rfc-lifecycle",
    "retired-references",
    "change-binding",
]
[[surface.rules]]
kind = "events"
globs = ["app/**/events.py"]
pattern = 'EVENT\("([^"]+)"\)'
