project_name = "soft-stale-reaper-fixture"

[paths]
docs_root = "docs"
source_roots = ["app"]

[checks]
enabled = [
    "frontmatter",
    "globs",
    "uniqueness",
    "links",
    "schema-leak",
    "coverage",
    "liar",
    "prose-file-reference",
    "rfc-lifecycle",
    "retired-references",
    "stale-reaper",
]

[checks.stale_reaper]
deprecated_threshold_days = 90
