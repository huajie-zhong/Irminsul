project_name = "soft-foundation-fresh-fixture"

[paths]
docs_root = "docs"
source_roots = ["app"]

[checks]
enabled = [
    "frontmatter",
    "globs",
    "uniqueness",
    "links",
    "schema-leak",
    "coverage",
    "liar",
    "prose-file-reference",
    "rfc-lifecycle",
    "retired-references",
    "foundation-readiness",
]
