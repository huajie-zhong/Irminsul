name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A merge queue re-runs the gate on the combined result, which is the only state
  # that is actually merged. Without this the queue would run nothing at all.
  merge_group:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mypy
        run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest
        run: pytest -q --cov=irminsul --cov-report=term-missing

  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: irminsul check (self)
        run: irminsul check
      - name: irminsul check against the integration base (self)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          # The branch this change is being integrated into, from whichever event
          # delivered it. Never HEAD: on a branch with commits, HEAD already holds the
          # change, so the comparison would be with itself. The CLI takes the merge base
          # of this ref and HEAD, so a base that has moved on does not report its own
          # commits as ours.
          BASE_REF: >-
            ${{ github.event_name == 'merge_group'
                && github.event.merge_group.base_ref
                || github.base_ref }}
        run: irminsul check --diff "origin/${BASE_REF#refs/heads/}"

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the checks that read git history find none at depth 1
      - name: Run the composite Action against this repository
        uses: ./
