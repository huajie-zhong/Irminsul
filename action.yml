name: irminsul
description: Run irminsul checks against your /docs tree.
branding:
  icon: book-open
  color: green

inputs:
  profile:
    description: 'Check profile to run: hard | configured | all-available.'
    default: hard
  strict:
    description: 'Promote warning findings to a non-zero exit code.'
    default: 'false'
  format:
    description: 'Output format: github | plain | json. Defaults to GitHub annotations on the failing line.'
    default: github
  version:
    description: >-
      Pin a specific irminsul release from PyPI. Unpinned, the CLI is installed
      from the same ref of this repository that the workflow references, so the
      inputs above always match the installed CLI.
    default: ''

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install irminsul
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          pip install "irminsul==${{ inputs.version }}"
        elif [ -n "${{ github.action_repository }}" ] && [ -n "${{ github.action_ref }}" ]; then
          pip install "irminsul @ git+https://github.com/${{ github.action_repository }}@${{ github.action_ref }}"
        else
          pip install irminsul
        fi
    - name: Run irminsul check
      shell: bash
      run: |
        args=()
        if [ -n "${{ inputs.profile }}" ]; then args+=("--profile=${{ inputs.profile }}"); fi
        if [ -n "${{ inputs.format }}" ]; then args+=("--format=${{ inputs.format }}"); fi
        if [ "${{ inputs.strict }}" = "true" ]; then args+=(--strict); fi
        irminsul check "${args[@]}"
